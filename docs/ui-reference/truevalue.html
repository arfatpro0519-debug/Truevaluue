<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

<title>Truevalue</title>
<style>
:root{--bg:#f3f4f7;--cd:#fff;--tx:#161a22;--t2:#5b6372;--bd:#e2e5eb;--ac:#1f5fd1;--ab:#e7effd;--ok:#10704a;--ob:#e0f4ea;--wa:#7c5200;--wb:#fcefd2;--ng:#a02429;--nb:#fae6e7;--pm:#98a0ae;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--cd:#1a1e27;--tx:#eceef3;--t2:#a2a9b8;--bd:#2b303c;--ac:#7fa9f5;--ab:#1e2c47;--ok:#6fd3a3;--ob:#16352a;--wa:#f0c36a;--wb:#3a2e12;--ng:#f19a9d;--nb:#3d1d1f;--pm:#6d7585;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--cd:#1a1e27;--tx:#eceef3;--t2:#a2a9b8;--bd:#2b303c;--ac:#7fa9f5;--ab:#1e2c47;--ok:#6fd3a3;--ob:#16352a;--wa:#f0c36a;--wb:#3a2e12;--ng:#f19a9d;--nb:#3d1d1f;--pm:#6d7585;color-scheme:dark}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:30}
#hd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--cd);border-bottom:.5px solid var(--bd);padding:10px 16px;z-index:20}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:19px;margin:0;font-weight:600}#hd p{margin:0;font-size:12px;color:var(--t2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.ib button{width:36px;height:36px;border:.5px solid var(--bd);border-radius:10px;text-align:center;margin-left:6px}
main{padding:12px 14px;max-width:560px;margin:auto}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.ch{flex:none;padding:7px 12px;border:.5px solid var(--bd);border-radius:20px;background:var(--cd);font-size:13px}
.ch.on{background:var(--ac);color:var(--cd);border-color:var(--ac)}
.cd{display:block;width:100%;background:var(--cd);border:.5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.mt{font-weight:600;font-size:16px;margin:2px 0}.sm{font-size:12px;color:var(--t2)}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:8px;white-space:nowrap}
.ok{background:var(--ob);color:var(--ok)}.wa{background:var(--wb);color:var(--wa)}.ac{background:var(--ab);color:var(--ac)}.ng{background:var(--nb);color:var(--ng)}
.br{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.br b{text-align:right;font-weight:600}.tr{height:7px;border-radius:4px;background:var(--bg);overflow:hidden}.tr i{display:block;height:100%;border-radius:4px}
.ft{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:.5px solid var(--bd);font-size:12px;color:var(--t2)}.ft b{color:var(--tx);font-weight:600}
.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.gr div{background:var(--bg);border-radius:10px;padding:9px 11px}.gr b{display:block;font-size:16px}
.btn{width:100%;text-align:center;background:var(--ac);color:var(--cd);border-radius:12px;padding:12px;font-weight:600;margin-top:6px}a.btn{display:block;text-decoration:none}.btn.sc{background:var(--ab);color:var(--ac)}
input{width:100%;font:inherit;color:inherit;background:var(--cd);border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--bd)}.rw:last-child{border:0}
.ft2{font-size:11px;color:var(--t2);text-align:center;margin:14px 6px}.rg{position:relative;height:8px;background:var(--bg);border-radius:4px;margin-top:8px}.rg i{position:absolute;top:0;height:100%;background:var(--ac);opacity:.35;border-radius:4px}.rg u{position:absolute;top:-2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ac)}.rg b{position:absolute;top:-4px;width:2px;height:16px;margin-left:-1px;background:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:.5px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;text-align:center;font-size:11px;color:var(--t2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav .on{color:var(--ac);font-weight:600}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:var(--cd);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s;z-index:50}
.o #ov{opacity:1;pointer-events:auto}.o #sh{transform:none}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--cd);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
</style></head><body>
<header id="hd"><div class="r"><div><h1>Truevalue</h1><p>Données d’exemple · mis à jour il y a 4 min</p></div><div class="ib"><button data-lab="1" aria-label="Laboratoire" style="width:auto;padding:0 10px">Lab</button><button id="bh" aria-label="Glossaire">?</button><button id="br" aria-label="Actualiser">↻</button></div></div></header>
<main id="app"></main>
<nav id="nv"></nav>
<div id="ov"></div><section id="sh" role="dialog" aria-modal="true" aria-label="Détail"></section><div id="ts" role="status"></div>
<script>
var D=[
{lg:"Ligue 1",t:"21:00",h:"PSG",a:"Lyon",mk:"1X2",is:"Victoire PSG",bf:62,pm:55,sp:2,lq:18400,vl:41200,mv:"+2,1 pts",S:[["Victoire PSG",62,55],["Nul",21,24],["Victoire Lyon",17,21]]},
{lg:"Premier League",t:"17:30",h:"Arsenal",a:"Chelsea",mk:"Buts",is:"Moins de 2,5 buts",bf:52,pm:46,sp:1.5,lq:9100,vl:28700,mv:"−3,4 pts",S:[["Moins de 2,5",52,46],["Plus de 2,5",48,54]]},
{lg:"Liga",t:"20:00",h:"Real Madrid",a:"Séville",mk:"Les deux marquent",is:"Non",bf:59,pm:55,sp:1.5,lq:6200,vl:15300,mv:"stable",S:[["Non",59,55],["Oui",41,45]]},
{lg:"Serie A",t:"20:45",h:"Inter",a:"Naples",mk:"1X2",is:"Nul",bf:29,pm:25.5,sp:2.5,lq:4300,vl:22100,mv:"+0,8 pts",S:[["Victoire Inter",41,44],["Nul",29,25.5],["Victoire Naples",30,30.5]]}];
var X=[["Bundesliga","18:30","Bayern","Dortmund",1],["Ligue 1","19:00","Marseille","Nice",0],["Eredivisie","20:00","Ajax","PSV",0]];
var G=[{ty:"mv",lg:"Ligue 1",t:"19:00",h:"Marseille",a:"Nice",tt:"Mouvement 24 h",tx:"Victoire Nice : 31 % → 24 % sur Betfair",lb:"Variation",v:"−7 pts",vl:12800},{ty:"mv",lg:"Liga",t:"21:00",h:"Betis",a:"Villarreal",tt:"Retournement 24 h",tx:"Victoire Betis : le favori a changé sur Betfair",lb:"Variation",v:"−9 pts",vl:9400},{ty:"ct",lg:"Serie A",t:"18:00",h:"Lazio",a:"Torino",tt:"Contradiction",tx:"Betfair favorise la victoire Lazio, Polymarket favorise le nul",lb:"Désaccords",v:"2",vl:7600}];
function gl(){return G.filter(function(x){return S.f=="all"||S.f==x.ty}).map(function(x){return'<div class="cd"><div class="r"><span class="sm">'+x.lg+" · "+x.t+'</span><span class="tag '+(x.ty=="ct"?"ng":"wa")+'">'+x.tt+'</span></div><div class="mt">'+x.h+" – "+x.a+'</div><div class="sm">'+x.tx+'</div><div class="ft"><span>'+x.lb+' <b>'+x.v+'</b></span><span>Volume Betfair <b>'+x.vl.toLocaleString("fr-FR")+" €</b></span></div></div>"}).join("")}
var S={t:"ec",f:"all",s:"net",q:"",fv:{},ob:0,li:"all"},$=function(i){return document.getElementById(i)};
function f(n){return(Math.round(n*10)/10+"").replace(".",",")}
function g(d){return d.bf-d.pm}function n(d){return g(d)-d.sp}
function lv(d){var v=n(d);return d.lq<5000?["limité","ng"]:v>=4?["Fort","ok"]:v>=2?["Moyen","wa"]:["Faible","ac"]}
function bar(l,v,c,w){return'<div class="br"><span>'+l+'</span><div class="tr"><i style="width:'+(w||v)+'%;background:'+c+'"></i></div><b>'+(w?String(v).replace(".",","):f(v)+" %")+"</b></div>"}
function toast(m){var t=$("ts");t.textContent=m;t.style.opacity=1;setTimeout(function(){t.style.opacity=0},1800)}
function ag(d){return[2,4,3,12][D.indexOf(d)]}
function spark(d){var p=[.35,.55,.5,.8,1].map(function(k){return g(d)*k}),m=Math.max.apply(null,p),pts=p.map(function(v,i){return Math.round(i*70)+","+Math.round(44-v/m*38)}).join(" ");return'<div class="sm" style="margin-top:12px">Évolution de l’écart sur 24 h</div><svg viewBox="0 0 280 48" width="100%" height="48" role="img" aria-label="Évolution de l’écart"><polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function src(){return'<div class="sm" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px">'+[["Betfair","ok","2 min"],["Polymarket","ok","4 min"],["Scores ESPN","wa","18 min"]].map(function(s){return'<span><span class="tag '+s[1]+'" style="padding:0 6px">●</span> '+s[0]+" · "+s[1].replace("ok","à jour").replace("wa","retard")+" "+s[2]+"</span>"}).join("")+"</div>"}
function ob(){return S.ob?"":'<div class="cd" style="background:var(--ab);border-color:transparent"><div class="mt">Comment lire cet écran</div><div class="sm" style="color:var(--tx);margin:4px 0 10px">Truevalue compare les probabilités de Betfair et de Polymarket. Quand Polymarket est moins cher que Betfair sur une issue, l’écart peut être exploitable. Ouvre une carte pour comprendre, puis vérifie nos résultats passés dans Bilan.</div><button class="btn" data-ob="1" style="margin:0">Compris</button></div>'}
var AL='<div class="cd"><div class="mt">Alertes Telegram</div><div class="sm" style="margin:2px 0 8px">Reçois un message quand un écart net dépasse 4 pts avec une liquidité suffisante.</div><button class="btn sc" data-al="1" style="margin:0">Activer les alertes</button></div>';
var L=[["1 | Non | 1 | G2",41,38,25,63,"Forte",3],["1 | Oui | 1 | G3",34,31,19,60,"Modérée",2],["1 | Oui | X | G3",28,26,14,55,"Faible",4],["1 | Oui | 1 | G4",22,20,12,58,"Modérée",1],["1 | Non | X | G1",19,17,8,52,"Faible",3],["2 | Oui | 2 | G3",12,11,5,51,"Faible",2],["X | Oui | X | G3",9,8,3,38,"Équilibre",1]];
function wil(k,n){var z=1.96,p=k/n,d=1+z*z/n,c=p+z*z/(2*n),a=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n));return[100*(c-a)/d,100*(c+a)/d]}
function lab(){var its=["all","Équilibre","Faible","Modérée","Forte"],rows=L.filter(function(x){return S.li=="all"||x[5]==S.li});
return'<div class="r" style="margin-bottom:10px"><div class="mt" style="font-size:18px">Laboratoire</div><button class="ch" data-t="ec">← Retour</button></div><div class="cd" style="background:var(--wb);border-color:transparent"><div class="mt" style="color:var(--wa)">Outil d’étude, pas de pronostics</div><div class="sm" style="color:var(--tx);margin-top:2px">Chaque résultat affiche le nombre de matchs et la période. Sous 30 matchs réglés, aucune conclusion.</div></div><div class="gr"><div><span class="sm">Matchs analysés</span><b>187</b><span class="sm">1 sept. – 24 nov. 2026</span></div><div><span class="sm">Signatures observées</span><b>54 sur 72</b><span class="sm">2 avec n ≥ 30</span></div><div><span class="sm">Signatures complètes</span><b>118 matchs</b><span class="sm">69 incomplets</span></div><div><span class="sm">Données incohérentes</span><b>6 matchs</b><span class="sm">exclus des signaux</span></div></div><div class="cd"><div class="mt">Couverture des marchés</div>'+bar("1X2 FT",98,"var(--ac)")+bar("BTTS",91,"var(--ac)")+bar("Mi-temps",76,"var(--ac)")+bar("Buts O/U",69,"var(--ac)")+'</div><div class="cd"><div class="mt">Seuils d’intensité</div><div class="sm" style="margin-top:2px">Écart entre le favori et le second. Équilibre sous 4 pts · Faible sous 12 · Modérée sous 24 · Forte sous 40 · Extrême au-delà. Seuils à tester, non figés.</div></div><div class="mt" style="margin:14px 0 6px">Signatures observées</div><div class="sm" style="margin-bottom:8px">Intensité dominante</div><div class="seg">'+its.map(function(x){return'<button class="ch'+(S.li==x?" on":"")+'" data-li="'+x+'">'+(x=="all"?"Toutes":x)+"</button>"}).join("")+'</div><div class="sm" style="margin-bottom:10px">● taux observé · barre = intervalle de confiance 95 % · | = probabilité moyenne du marché</div>'+(rows.map(function(x){var n=x[2],i=wil(x[3],n),p=Math.round(100*x[3]/n),low=n<30,v=x[4];return'<div class="cd"'+(low?' style="opacity:.62"':"")+'><div class="r"><b>'+x[0]+'</b><span class="tag '+(low?"wa":"ac")+'">'+n+' réglés</span></div><div class="sm">'+x[1]+" matchs · "+x[5]+" · "+x[6]+' avec contradiction · 1 sept. – 24 nov.</div><div style="margin:10px 0 2px">Favori gagnant : <b>'+p+' %</b> <span class="sm">IC 95 % : '+Math.round(i[0])+"–"+Math.round(i[1])+' %</span></div><div class="rg"><i style="left:'+i[0]+"%;width:"+(i[1]-i[0])+'%"></i><u style="left:'+p+'%"></u><b style="left:'+v+'%"></b></div><div class="sm" style="margin-top:8px">Probabilité moyenne du marché : '+v+' %</div><div class="sm" style="margin-top:2px">'+(low?"Échantillon trop faible : pas de conclusion.":v>=i[0]&&v<=i[1]?"Compatible avec le marché.":"Écart au marché à confirmer.")+"</div></div>"}).join("")||'<p class="sm">Aucune signature pour ce filtre.</p>')+'<p class="sm">18 signatures sur 72 n’ont jamais été observées et ne sont pas listées. Aucun classement par performance : seul le nombre de matchs trie la liste.</p>'+FOOT}
var LB='<div class="cd"><div class="mt">Laboratoire</div><div class="sm" style="margin:2px 0 8px">Explore les 72 signatures de marché, avec leur taille d’échantillon et leur incertitude.</div><button class="btn sc" data-lab="1" style="margin:0">Ouvrir le Laboratoire</button></div>';
var FOOT='<p class="ft2">18+ · Outil d’analyse statistique, aucun gain garanti. Non affilié à Betfair ni Polymarket.</p>';
function lst(){var a=D.filter(function(){return S.f=="all"||S.f=="net"});a.sort(function(x,y){return S.s=="net"?n(y)-n(x):(x.t<y.t?-1:1)});
return a.map(function(d){var l=lv(d);return'<button class="cd" data-i="'+D.indexOf(d)+'"><div class="r"><span class="sm">'+(S.fv[D.indexOf(d)]?"★ ":"")+d.lg+" · "+d.t+'</span><span class="tag '+l[1]+'">Niveau '+l[0]+'</span></div><div class="mt">'+d.h+" – "+d.a+'</div><div class="sm" style="margin-bottom:6px">'+d.is+" · "+d.mk+"</div>"+bar("Betfair",d.bf,"var(--ac)")+bar("Polymarket",d.pm,"var(--pm)")+'<div class="ft"><span>Écart <b>'+f(g(d))+' pts</b></span><span>Valeur nette <b>+'+f(n(d))+' pts</b></span><span>Liquidité <b>'+Math.round(d.lq/1000)+" k$</b></span><span>"+(ag(d)>10?"⚠ ":"")+"il y a "+ag(d)+" min</span></div></button>"}).join("")+gl()||'<p class="sm">Aucun signal pour ce filtre.</p>'}
function ecarts(){var fs=["all","net","mv","ct"],lb=["Tous","Écarts nets","Mouvements 24 h","Contradictions"];
return ob()+src()+'<div class="seg">'+fs.map(function(x,i){return'<button class="ch'+(S.f==x?" on":"")+'" data-f="'+x+'">'+lb[i]+"</button>"}).join("")+'</div><div class="r" style="margin-bottom:10px"><span class="sm">'+(D.length+G.length)+' signaux avant coup d’envoi</span><span class="seg" style="padding:0"><button class="ch'+(S.s=="net"?" on":"")+'" data-s="net">Valeur nette</button><button class="ch'+(S.s=="t"?" on":"")+'" data-s="t">Heure</button></span></div><div id="ls">'+lst()+"</div>"+AL+FOOT}
function mlst(){var q=S.q.toLowerCase(),a=D.map(function(d,i){return[d.lg,d.t,d.h,d.a,1,i]}).concat(X).filter(function(m){return(m[2]+" "+m[3]+" "+m[0]).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return a[1]<b[1]?-1:1});
return a.map(function(m){var tg=m[4]?'<span class="tag ok">Betfair + Polymarket</span>':'<span class="tag ac">Betfair seul</span>';return'<'+(m.length>5?'button data-i="'+m[5]+'"':"div")+' class="rw" style="width:100%"><div><b>'+m[2]+" – "+m[3]+'</b><div class="sm">'+m[0]+" · "+m[1]+"</div></div>"+tg+"</"+(m.length>5?"button":"div")+">"}).join("")||'<p class="sm">Aucun match trouvé.</p>'}
function matchs(){return'<input id="q" type="search" placeholder="Équipe ou compétition" aria-label="Rechercher un match" value="'+S.q+'"><div class="cd" id="ml" style="padding:4px 14px">'+mlst()+"</div>"+FOOT}
function bilan(){var T=[["Écarts nets",142,54],["Mouvements 24 h",87,49],["Contradictions",21,43]],J=[["PSG – Lyon","Victoire PSG","2–1","Confirmé","ok"],["Lazio – Torino","Plus de 2,5 buts","1–0","Infirmé","ng"],["Brest – Lens","Brest (nul remboursé)","0–0","Remboursé","ac"],["Betis – Getafe","Les deux marquent","2–2","Confirmé","ok"]];
return'<div class="cd"><div class="sm">Qui est le plus précis ?</div><div class="mt" style="font-size:17px">Betfair devance Polymarket de peu</div><div class="sm" style="margin-bottom:8px">312 marchés réglés · score de Brier, plus bas = plus précis</div>'+bar("Betfair",0.198,"var(--ac)",49.5)+bar("Polymarket",0.204,"var(--pm)",51)+'</div><div class="cd"><div class="mt">Fiabilité par type de signal</div><div class="sm">Part de signaux confirmés après le match</div>'+T.map(function(t){return'<div class="rw"><div><b>'+t[0]+'</b><div class="sm">n = '+t[1]+(t[1]<30?' · échantillon trop faible':"")+'</div></div><span class="tag '+(t[1]<30?"wa":"ac")+'">'+t[2]+" %</span></div>"}).join("")+'</div><div class="cd"><div class="mt">Rendement théorique : +1,8 u</div><div class="sm">Sur 142 écarts nets, à mise fixe de 1 u, avant frais. Écart trop faible pour conclure.</div></div><div class="cd" style="padding:4px 14px"><div class="mt" style="padding-top:10px">Derniers résultats</div>'+J.map(function(j){return'<div class="rw"><div><b>'+j[0]+'</b><div class="sm">'+j[1]+" · "+j[2]+'</div></div><span class="tag '+j[4]+'">'+j[3]+"</span></div>"}).join("")+"</div>"+LB+FOOT}
var IC={ec:'<path d="M3 17l5-5 4 4 8-9"/>',ma:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bi:'<path d="M4 20V10M12 20V4M20 20v-7"/>'},NM={ec:"Écarts",ma:"Matchs",bi:"Bilan"};
function render(){$("nv").innerHTML=["ec","bi","ma"].map(function(k){return'<button data-t="'+k+'" class="'+(S.t==k?"on":"")+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+"</svg>"+NM[k]+"</button>"}).join("");$("app").innerHTML=S.t=="ec"?ecarts():S.t=="ma"?matchs():S.t=="lb"?lab():bilan()}

function det(i){var d=D[i],l=lv(d);sheet('<div class="r"><div><div class="mt">'+d.h+" – "+d.a+'</div><div class="sm">'+d.lg+" · "+d.t+" · "+d.mk+'</div></div><span class="tag '+l[1]+'">Niveau '+l[0]+'</span></div><p style="margin:12px 0">Polymarket cote « '+d.is+" » à "+f(d.pm)+" %, alors que Betfair, marge retirée, l’estime à "+f(d.bf)+" %. Après "+f(d.sp)+" pts de spread, il reste <b>"+f(n(d))+" pts</b> de valeur nette.</p>"+d.S.map(function(s){return'<div class="sm" style="margin-top:8px;font-weight:600">'+s[0]+"</div>"+bar("Betfair",s[1],"var(--ac)")+bar("Polymarket",s[2],"var(--pm)")}).join("")+'<div class="gr"><div><span class="sm">Écart</span><b>'+f(g(d))+' pts</b></div><div><span class="sm">Valeur nette</span><b>+'+f(n(d))+' pts</b></div><div><span class="sm">Liquidité Polymarket</span><b>'+d.lq.toLocaleString("fr-FR")+' $</b></div><div><span class="sm">Volume Betfair</span><b>'+d.vl.toLocaleString("fr-FR")+' €</b></div></div>'+spark(d)+'<div class="sm">Mouvement Betfair sur 24 h : '+d.mv+" · données il y a "+ag(d)+' min</div><a class="btn" href="https://polymarket.com" target="_blank" rel="noopener">Voir le marché sur Polymarket</a><button class="btn sc" data-fv="'+i+'">'+(S.fv[i]?"★ Suivi · alerte activée":"☆ Suivre ce match")+'</button><button class="btn sc" data-sh="'+i+'">Partager cet écart</button>')}
function fav(i){S.fv[i]=!S.fv[i];toast(S.fv[i]?"Alerte Telegram activée pour ce match":"Alerte désactivée");det(i);render()}
function share(i){var d=D[i],t=d.h+" – "+d.a+" · "+d.is+" : Betfair "+f(d.bf)+" % contre Polymarket "+f(d.pm)+" % (écart "+f(g(d))+" pts)";try{if(navigator.share){navigator.share({text:t});return}navigator.clipboard.writeText(t).then(function(){toast("Texte copié")},function(){toast("Copie impossible")})}catch(e){toast("Partage indisponible")}}
function help(){var G=[["Probabilité Betfair","Cote convertie en probabilité, marge du bookmaker retirée."],["Prix Polymarket","Prix de l’issue : 55 ¢ équivaut à 55 %."],["Écart","Différence entre les deux, en points (pts)."],["Valeur nette","Écart moins le spread Polymarket (coût d’achat et de vente)."],["Niveau","Fort : 4 pts nets ou plus. Moyen : 2 pts ou plus. Faible : en dessous. Limité : liquidité Polymarket sous 5 000 $, l’écart est difficile à saisir. Règle simple, pas une probabilité de gain."],["Signature","Combinaison des favoris de 4 blocs : résultat final (1, X, 2), les deux marquent, mi-temps et profil de buts (G1 à G4). 72 combinaisons possibles."],["Intensité","Écart en points entre le favori et le second d’un marché : équilibre, faible, modérée, forte, extrême."],["Intervalle de confiance (IC 95 %)","Plage où se situe probablement le vrai taux. Plus l’échantillon est petit, plus elle est large."],["Mouvement 24 h","Variation de la probabilité Betfair sur 24 heures. Un retournement : le favori change."],["Contradiction","Betfair et Polymarket ne désignent pas la même issue comme la plus probable."],["Score de Brier","Mesure la précision d’une probabilité après le match. Plus bas = plus précis."],["Confirmé, infirmé, remboursé","Issue du signal après le score final. Remboursé : match nul sur un pari sans le nul, ou match annulé."]];
sheet('<div class="r"><div class="mt">Glossaire</div></div>'+G.map(function(x){return'<div class="rw" style="display:block"><b>'+x[0]+'</b><div class="sm">'+x[1]+"</div></div>"}).join(""))}
document.addEventListener("click",function(e){var b=e.target.closest("button"),c;if(e.target.id=="ov"){close();return}if(!b)return;
if((c=b.dataset.t)){S.t=c;render();scrollTo(0,0)}else if((c=b.dataset.f)){S.f=c;render()}else if((c=b.dataset.s)){S.s=c;render()}else if(b.dataset.sh!==undefined)share(+b.dataset.sh);else if(b.dataset.i!==undefined)det(+b.dataset.i);else if(b.dataset.lab){S.t="lb";render();scrollTo(0,0)}else if(b.dataset.li){S.li=b.dataset.li;render()}else if(b.dataset.ob){S.ob=1;render()}else if(b.dataset.fv!==undefined)fav(+b.dataset.fv);else if(b.dataset.al)toast("Aperçu : relié au bot Telegram dans la vraie version");else if(b.id=="bh")help();else if(b.id=="br"){render();toast("Données actualisées")}});
